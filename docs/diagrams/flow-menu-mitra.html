  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-paper:       #f5f5f5;
      --color-card:        #ffffff;
      --color-ink:         #2d3142;
      --color-muted:       #4f5d75;
      --color-accent:      #bf4520;
      --color-border:      rgba(45, 49, 66, 0.15);
      --font-serif:        'Instrument Serif', Georgia, serif;
      --font-sans:         'Geist', system-ui, sans-serif;
      --font-mono:         'Geist Mono', monospace;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-paper);
      color: var(--color-ink);
      padding: 3rem 1.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 1140px;
      width: 100%;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 2.5rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .canvas-card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 2.25rem 2rem;
      overflow-x: auto;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 1020px;
      height: auto;
    }
  </style>
</head>
