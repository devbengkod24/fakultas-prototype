<!-- Header -->
<div class="flex flex-col gap-2.5 sm:flex-row sm:items-center sm:justify-between pb-0.5">
  <div>
    <h2 class="text-base font-semibold text-[#09090b]">Pengumuman MBKM</h2>
    <p class="text-[11px] text-[#71717a]">Broadcast siaran informasi resmi MBKM tingkat prodi dan fakultas.</p>
  </div>
  <div class="flex items-center gap-2">
    <button
      type="button"
      onclick="showBuatPengumumanModal()"
      class="px-3 py-1.5 rounded-lg bg-[#0655a7] hover:bg-[#114d91] text-white text-xs font-semibold shadow-2xs flex items-center gap-1.5 transition-all"
    >
      <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
      <span>+ Buat Pengumuman</span>
    </button>
  </div>
</div>

<!-- Filter & Search Toolbar -->
<div class="flex flex-col sm:flex-row items-center justify-between gap-2.5 p-3 bg-white rounded-xl border border-[#e4e4e7] shadow-2xs">
  <div class="relative w-full sm:w-80">
    <i data-lucide="search" class="w-3.5 h-3.5 text-[#71717a] absolute left-3 top-1/2 -translate-y-1/2"></i>
    <input
      type="text"
      id="search-pengumuman"
      oninput="handleSearchPengumuman(this.value)"
      placeholder="Cari judul atau isi pengumuman..."
      class="w-full pl-9 pr-3 py-1.5 text-xs rounded-lg border border-[#e4e4e7] bg-[#fafafa] focus:bg-white focus:outline-none focus:ring-1 focus:ring-[#0655a7]"
    />
  </div>
  <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
    <select
      id="filter-pengumuman-sasaran"
      onchange="handleFilterPengumumanSasaran(this.value)"
      class="px-2.5 py-1.5 text-xs rounded-lg border border-[#e4e4e7] bg-white text-[#3f3f46] focus:outline-none focus:ring-1 focus:ring-[#0655a7]"
    >
      <option value="semua">Semua Sasaran</option>
      <option value="semua_mhs">Semua Mahasiswa MBKM</option>
      <option value="mitra_dpl">Mitra & DPL</option>
      <option value="magang">Peserta Magang Industri</option>
      <option value="studi_independen">Peserta Studi Independen</option>
    </select>
    <select
      id="filter-pengumuman-status"
      onchange="handleFilterPengumumanStatus(this.value)"
      class="px-2.5 py-1.5 text-xs rounded-lg border border-[#e4e4e7] bg-white text-[#3f3f46] focus:outline-none focus:ring-1 focus:ring-[#0655a7]"
    >
      <option value="semua">Semua Status</option>
      <option value="published">Dipublikasikan</option>
      <option value="draft">Draf</option>
      <option value="archived">Diarsipkan</option>
    </select>
  </div>
</div>

<!-- Cards View Container -->
<div id="pengumuman-cards-container" class="grid grid-cols-1 gap-3">
  <!-- Populated dynamically via renderPengumumanCards() -->
</div>

<!-- Footer Pagination / Info -->
<div class="flex flex-col sm:flex-row items-center justify-between gap-2 pt-1 text-[11px] text-[#71717a]">
  <div id="pengumuman-table-info">Menampilkan pengumuman</div>
  <div id="pengumuman-pagination-controls" class="flex items-center gap-1"></div>
</div>
