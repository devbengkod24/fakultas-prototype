<div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
              <div>
                <h2 class="text-base font-semibold text-[#09090b]">Data Laporan Akhir</h2>
                <p class="text-[11px] text-[#71717a]">
                  Rekap berkas pertanggungjawaban dan laporan akhir program mahasiswa.
                </p>
              </div>
              <div class="flex items-center gap-1.5">
                <label for="search-laporan" class="text-[11px] text-[#71717a]">Search:</label>
                <input
                  type="text"
                  id="search-laporan"
                  oninput="handleSearchLaporan(this.value)"
                  placeholder="Cari nama/NIM..."
                  class="px-2.5 py-1 text-xs rounded-lg border border-[#e4e4e7] bg-white focus:outline-none focus:ring-1 focus:ring-[#0655a7] w-52"
                />
              </div>
            </div>

            <!-- Tabel Laporan Akhir (Screenshot 11) -->
            <div class="overflow-x-auto rounded-xl border border-[#e4e4e7]">
              <table class="w-full text-xs text-left border-collapse">
                <thead class="bg-[#fafafa] border-b border-[#e4e4e7] text-[#3f3f46]">
                  <tr>
                    <th class="w-12 px-2.5 py-2 font-semibold text-center text-[11px]">No</th>
                    <th class="px-3 py-2 font-semibold text-[11px]">Nama Mahasiswa</th>
                    <th class="px-3 py-2 font-semibold text-[11px]">NIM</th>
                    <th class="px-3 py-2 font-semibold text-center w-32 text-[11px]">Aksi</th>
                  </tr>
                </thead>
                <tbody id="laporan-table-tbody" class="divide-y divide-[#e4e4e7] bg-white">
                  <!-- Populated dynamically via renderLaporanTable() -->
                </tbody>
              </table>
            </div>

            <!-- Footer Informasi & Pagination di Kanan Bawah -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-2 pt-0.5">
              <div id="laporan-table-info" class="text-[11px] text-[#71717a]">Showing entries</div>
              <div id="laporan-pagination-controls" class="flex items-center self-end gap-1 sm:self-auto">
                <!-- Pagination buttons generated dynamically -->
              </div>
            </div>
